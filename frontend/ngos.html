<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer & NGO Community | Mohalla Seva</title>

  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  

  <!-- Project Styles -->
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="volunteer.css">
</head>

<body>

  <!-- Unified Global Header (Auto-hydrated by navbar.js) -->
  <header class="ms-header"></header>

  <!-- Main Community Window (Curved Corners, WhatsApp Web Style) -->
  <div class="volunteer-main-container">
    
    <!-- Left Column: Scrollable NGO Directory -->
    <div class="ngo-sidebar-pane">
      
      <!-- Top Search Bar -->
      <div class="ngo-search-wrap">
        <div class="ngo-search-input-box">
          <span class="material-symbols-outlined" style="color:#64748b;">search</span>
          <input type="text" id="ngo-search-input" placeholder="Search accredited NGOs...">
        </div>
      </div>

      <!-- Functional Toggles: All NGO vs My NGO -->
      <div class="ngo-toggle-strip">
        <button type="button" class="ngo-toggle-btn active" id="toggle-all-ngo">All NGO</button>
        <button type="button" class="ngo-toggle-btn" id="toggle-my-ngo">My NGO</button>
      </div>

      <!-- Scrollable NGO List -->
      <div class="ngo-cards-list" id="ngo-cards-list"></div>

    </div>

    <!-- Right Column: Unjoined Overview or WhatsApp Style Chat Stage -->
    <div class="ngo-main-stage" id="ngo-main-stage">
      <!-- Injected dynamically by volunteer.js -->
    </div>

  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="volunteer.js"></script>
</body>

</html>
